<!-- Reusable Navigation Header Component for PuneUP -->
<header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-100 shadow-sm transition-all duration-300">

            <a href="../index.html" class="flex items-center gap-2.5 group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center text-white shadow-md shadow-brand-500/20 group-hover:scale-105 transition-transform">
                    <i class="fa-solid fa-house-chimney text-lg"></i>
                </div>
                <div>
                    <span class="text-2xl font-extrabold tracking-tight text-slate-900">Pune<span class="text-brand-600">UP</span></span>
                    <span class="block text-[10px] tracking-wider uppercase font-semibold text-slate-400 -mt-1">Real Estate Hub</span>
                </div>
            </a>

            <!-- Desktop Navigation Links -->
            <nav class="hidden lg:flex items-center gap-7 text-sm font-semibold text-slate-600">

                <a href="properties.html" class="hover:text-brand-600 transition-colors">Properties</a>

            <!-- Actions: Wishlist, Sign in & Post Property -->
            <div class="flex items-center gap-3">

                <button onclick="openModal('loginModal')" class="hidden sm:inline-flex items-center gap-2 text-sm font-semibold text-slate-700 hover:text-brand-600 px-3 py-2 transition-colors">

                    <span>Post Property</span>
                    <span class="hidden sm:inline-block text-[11px] bg-white/20 px-1.5 py-0.5 rounded font-normal">Free</span>
                </a>
